<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f0f2f5; }
.box { max-width: 550px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<div class="box">
<h3 class="text-center mb-1">Student Registration Form</h3>
<p class="text-center text-muted">By Lohitha Jami</p>
<hr>
<form>
<label class="form-label">Full Name</label>
<input type="text" class="form-control mb-3" placeholder="Ex: Lohitha Jami" required>

<label class="form-label">Email</label>
<input type="email" class="form-control mb-3" placeholder="Ex: lohitha@gmail.com" required>

<label class="form-label">Phone</label>
<input type="tel" class="form-control mb-3" placeholder="Ex: 9876543210" required>

<label class="form-label">Course</label>
<select class="form-select mb-3">
<option>BCA</option>
<option>BSc</option>
<option>B.Com</option>
<option>B.Tech</option>
</select>

<label class="form-label">City</label>
<input type="text" class="form-control mb-3" placeholder="Ex: Visakhapatnam">

<label class="form-label">Gender</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender" class="ms-3"> Female
<br><br>

<label class="form-label">Skills</label><br>
<input type="checkbox"> HTML
<input type="checkbox" class="ms-2"> CSS
<input type="checkbox" class="ms-2"> SQL
<br><br>

<button class="btn btn-primary w-100">Register Now</button>
</form>
</div>
</body>
</html>
